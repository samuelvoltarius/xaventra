{{- if .Values.tenant.enabled }}
{{- $full := include "xaventra.fullname" . -}}
{{- if .Values.tenant.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    {{- include "xaventra.labels" . | nindent 4 }}
    xaventra.ai/tenant: {{ default .Release.Namespace .Values.tenant.name | quote }}
    # Workers keep their /runtime in a hostPath (one fixed Xaventra directory per
    # node), which every stricter Pod Security level forbids. Everything else in
    # the chart meets "restricted"; audit reports deviations.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
---
{{- end }}
# Upper bounds for this customer's namespace.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ $full }}-quota
  labels:
    {{- include "xaventra.labels" . | nindent 4 }}
spec:
  hard:
    {{- toYaml .Values.tenant.resourceQuota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ $full }}-limits
  labels:
    {{- include "xaventra.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        {{- toYaml .Values.tenant.limitRange.default | nindent 8 }}
      defaultRequest:
        {{- toYaml .Values.tenant.limitRange.defaultRequest | nindent 8 }}
      max:
        {{- toYaml .Values.tenant.limitRange.max | nindent 8 }}
---
# Isolation: default deny for every pod in this namespace. Only the release
# policies (networkpolicies.yaml) open single ports; nothing from other
# namespaces gets in, and this policy widens nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-tenant-isolation
  labels:
    {{- include "xaventra.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
{{- end }}
