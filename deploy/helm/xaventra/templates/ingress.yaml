{{- if .Values.ingress.enabled }}
{{- if not .Values.main.enabled }}
{{- fail "ingress.enabled braucht main.enabled=true: ohne Main im Cluster gibt es kein Dashboard zum Veröffentlichen." }}
{{- end }}
{{- $full := include "xaventra.fullname" . -}}
{{- $host := required "ingress.host fehlt (z. B. xaventra.example.com; auch in dashboard.publicHosts der Main eintragen)" .Values.ingress.host -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}
  labels:
    {{- include "xaventra.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-api
                port:
                  name: dashboard
{{- end }}
