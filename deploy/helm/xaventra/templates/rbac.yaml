{{- $full := include "xaventra.fullname" . -}}
{{- $workerNames := list -}}
{{- range $key, $w := .Values.workers -}}
{{- if $w.enabled -}}
{{- $workerNames = append $workerNames (printf "%s-%s" $full $w.name) -}}
{{- end -}}
{{- end -}}
# Workers never talk to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-worker
  labels:
    {{- include "xaventra.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.control.enabled }}
---
# Xaventra's own control account. Used by an in-cluster Main (mounted) or by
# the external Main with a short-lived token created by pipe (docs/KUBERNETES.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-control
  labels:
    {{- include "xaventra.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
# Only the own namespace. No secrets, no pods/exec|attach|portforward|proxy,
# no delete, no create, nothing cluster-wide. Writes only on named own objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $full }}-control
  labels:
    {{- include "xaventra.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  {{- if $workerNames }}
  # Rollout restart (template annotation) and card-approved chart updates of the
  # own worker DaemonSets. resourceNames is never empty here: an empty list
  # would mean "all objects".
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames:
      {{- range $name := $workerNames }}
      - {{ $name | quote }}
      {{- end }}
    verbs: ["patch"]
  {{- end }}
  {{- if .Values.main.enabled }}
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: [{{ printf "%s-main" $full | quote }}]
    verbs: ["patch"]
  {{- end }}
  # The control policy of this release (read only).
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ printf "%s-control" $full | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $full }}-control
  labels:
    {{- include "xaventra.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $full }}-control
subjects:
  - kind: ServiceAccount
    name: {{ $full }}-control
    namespace: {{ .Release.Namespace }}
{{- end }}
