{{- $full := include "xaventra.fullname" . -}}
{{- if .Values.networkPolicy.enabled }}
# Workers: nobody connects to them. They dial the Main themselves (mesh) and
# answer on that connection; an in-cluster Main may additionally reach the
# mesh port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-workers
  labels:
    {{- include "xaventra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "xaventra.selectorLabels" . | nindent 6 }}
      xaventra.ai/component: worker
  policyTypes:
    - Ingress
  {{- if .Values.main.enabled }}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "xaventra.selectorLabels" . | nindent 14 }}
              xaventra.ai/component: main
      ports:
        - port: {{ .Values.mesh.directPort }}
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
{{- if .Values.main.enabled }}
---
# In-cluster Main: mesh only from pods of this release (plus explicitly listed
# peers), API/dashboard only from this release and the listed clients.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-main
  labels:
    {{- include "xaventra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "xaventra.selectorLabels" . | nindent 6 }}
      xaventra.ai/component: main
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "xaventra.selectorLabels" . | nindent 14 }}
        {{- with .Values.networkPolicy.meshFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: {{ .Values.mesh.directPort }}
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              {{- include "xaventra.selectorLabels" . | nindent 14 }}
        {{- with .Values.networkPolicy.apiFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: {{ .Values.main.dashboard.port }}
          protocol: TCP
        {{- if .Values.main.api.enabled }}
        - port: {{ .Values.main.api.port }}
          protocol: TCP
        {{- end }}
{{- end }}
{{- if .Values.networkPolicy.lockSandboxEgress }}
{{- range $key, $w := .Values.workers }}
{{- if and $w.enabled $w.sandbox }}
---
# Sandbox workload: may only resolve names, reach an in-cluster Main's mesh
# port and the explicitly listed destinations.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-{{ $w.name }}-egress
  labels:
    {{- include "xaventra.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "xaventra.selectorLabels" $ | nindent 6 }}
      xaventra.ai/workload: {{ $w.name }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if $.Values.main.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "xaventra.selectorLabels" $ | nindent 14 }}
              xaventra.ai/component: main
      ports:
        - port: {{ $.Values.mesh.directPort }}
          protocol: TCP
    {{- end }}
    {{- with $.Values.networkPolicy.sandboxEgressTo }}
    - to:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
