{{- $full := include "xaventra.fullname" . -}}
{{- $ext := .Values.externalMain -}}
{{- if or $ext.nodeId $ext.url $ext.publicKey -}}
{{- if not (and $ext.nodeId $ext.url $ext.publicKey) -}}
{{- fail "externalMain braucht nodeId, url UND publicKey (öffentlicher Schlüssel) — oder alles leer lassen." -}}
{{- end -}}
{{- if contains "PRIVATE KEY" $ext.publicKey -}}
{{- fail "externalMain.publicKey enthält einen PRIVATEN Schlüssel — nur den öffentlichen eintragen." -}}
{{- end -}}
{{- $tailscaleWs := `^ws://100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.(25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})\.(25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})(:[0-9]{1,5})?(/.*)?$` -}}
{{- if not (or (hasPrefix "wss://" $ext.url) (regexMatch $tailscaleWs $ext.url)) -}}
{{- fail "externalMain.url: ws:// nur mit Tailscale-Adresse (CGNAT-Bereich 100.64/10), sonst wss://." -}}
{{- end -}}
{{- end -}}
{{- if not (or .Values.config.existingSecret .Values.config.existingConfigMap .Values.config.fromRuntime) }}
{{- $config := deepCopy .Values.config.values }}
{{- if $ext.nodeId }}
{{- $mesh := default (dict) $config.mesh }}
{{- $direct := default (dict) $mesh.direct }}
{{- $peer := dict "nodeId" $ext.nodeId "url" $ext.url "publicKey" $ext.publicKey "roles" $ext.roles }}
{{- $_ := set $direct "peers" (append (default (list) $direct.peers) $peer) }}
{{- $_ := set $mesh "direct" $direct }}
{{- $_ := set $config "mesh" $mesh }}
{{- end }}
# Non-secret worker configuration. Secrets come from secrets.existingSecret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-config
  labels:
    {{- include "xaventra.labels" . | nindent 4 }}
data:
  xaventra.config.json: |
    {{- toJson $config | nindent 4 }}
{{- end }}
{{- if .Values.control.enabled }}
---
# What Xaventra may steer in this release (read by src/infra/kubernetes.ts,
# mounted in an in-cluster Main or read over the API by the external Main).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-control
  labels:
    {{- include "xaventra.labels" . | nindent 4 }}
data:
  control.json: |
    {
      "schema": 2,
      "namespace": {{ .Release.Namespace | quote }},
      "release": {{ .Release.Name | quote }},
      "fullname": {{ $full | quote }},
      "controlConfigMap": {{ printf "%s-control" $full | quote }},
      "image": { "repository": {{ .Values.image.repository | quote }} },
      "workerNodeLabel": {{ .Values.workerNodes.label | quote }},
      "workloads": {
        {{- $first := true }}
        {{- if .Values.main.enabled }}
        "main": { "kind": "StatefulSet", "object": {{ printf "%s-main" $full | quote }}, "container": "xaventra", "role": "main" }
        {{- $first = false }}
        {{- end }}
        {{- range $key, $w := .Values.workers }}
        {{- if $w.enabled }}
        {{- if not $first }},{{ end }}
        {{ $w.name | quote }}: { "kind": "DaemonSet", "object": {{ printf "%s-%s" $full $w.name | quote }}, "container": "xaventra", "role": {{ $w.controlRole | quote }} }
        {{- $first = false }}
        {{- end }}
        {{- end }}
      }
    }
{{- end }}
