apiVersion: v2
name: xaventra
description: >-
  Xaventra on Kubernetes. Kubernetes decides WHERE a process runs; Xaventra
  decides WHAT runs, with which model, tool and data, and whether an approval
  is needed. Kubernetes never replaces the Xaventra mesh, its lease, witness
  epoch or fencing.
