services:
  nova-worker:
    image: nova-worker:current
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nova-worker
    network_mode: host
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"
    user: "1000:1000"
    env_file:
      - .nova.env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=1024"
      NOVA_NODE_ONLY: "true"
      NOVA_NO_TELEGRAM: "true"
      NOVA_TELEGRAM_MODE: disabled
      NOVA_MAIN_ELIGIBLE: "false"
      NOVA_MESH_FAILOVER_MAIN: "false"
      NOVA_SKIP_MODEL_RESOLVER_INIT: "false"
    volumes:
      - ./xaventra.config.json:/app/xaventra.config.json:ro
      - ./data:/app/.nova-data
      - ./learning:/app/.nova-learning
      - ./vector:/app/.nova-vector-memory
      - ./logs:/app/.nova-logs
      - ./agent:/app/.agent
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "${NOVA_CPU_LIMIT:-1.0}"
    mem_limit: "${NOVA_MEMORY_LIMIT:-1536m}"
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(require('fs').existsSync('/app/dist/daemon.js') ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
