services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.146.1
    container_name: nova-otel-collector
    restart: unless-stopped
    depends_on:
      - tempo
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ./otel-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks: [nova-otel]

  prometheus:
    image: prom/prometheus:latest
    container_name: nova-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    networks: [nova-otel]

  tempo:
    image: grafana/tempo:2.7.2
    container_name: nova-tempo
    restart: unless-stopped
    user: "0:0"
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [nova-otel]

  grafana:
    image: grafana/grafana:latest
    container_name: nova-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - tempo
    ports:
      - "3456:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [nova-otel]

volumes:
  prometheus-data:
  tempo-data:
  grafana-data:

networks:
  nova-otel:
    driver: bridge
