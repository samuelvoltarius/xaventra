name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Native Windows installer prerequisite check
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -Check
      - name: Unix installer prerequisite check
        if: runner.os != 'Windows'
        run: sh install.sh --check
      - name: Seed isolated development configuration
        run: node scripts/setup.mjs --configure-only
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
        env:
          NOVA_SKIP_MODEL_RESOLVER_INIT: "1"
      - run: npm run build
      - name: Compiled Doctor artifact download and ESM configuration acceptance
        run: node scripts/check-doctor-artifacts.mjs
        timeout-minutes: 3
        env:
          XAVENTRA_DOCTOR_QA_DIR: ${{ github.workspace }}/.nova-data/doctor-qa
      - name: Preserve Doctor acceptance reports including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-artifact-qa-${{ matrix.os }}
          path: .nova-data/doctor-qa/**/report.json
          retention-days: 14
          include-hidden-files: true
      - name: Compiled Doctor result validation with scripted engine
        run: node --experimental-vm-modules scripts/check-doctor-validation.mjs
        timeout-minutes: 3
        env:
          XAVENTRA_DOCTOR_QA_DIR: ${{ github.workspace }}/.nova-data/doctor-qa
      - name: Preserve Doctor validation reports including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-validation-qa-${{ matrix.os }}
          path: .nova-data/doctor-qa/**/report.json
          retention-days: 14
          include-hidden-files: true
      - name: Compiled response contract and authenticated REST acceptance
        run: node scripts/check-response-contract.mjs
        timeout-minutes: 6
        env:
          XAVENTRA_RESPONSE_QA_DIR: ${{ github.workspace }}/.nova-data/response-qa
      - name: Actual Desktop API output contract acceptance
        run: node scripts/check-response-pipeline.mjs
        timeout-minutes: 3
        env:
          XAVENTRA_RESPONSE_QA_DIR: ${{ github.workspace }}/.nova-data/response-qa
      - name: Preserve response contract reports including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: response-contract-qa-${{ matrix.os }}
          path: .nova-data/response-qa/**/report.json
          retention-days: 14
          include-hidden-files: true
      - name: Isolated compiled daemon boot and graceful stop
        run: npm run check:daemon
        timeout-minutes: 4
      - run: npm run check:catalogs
      - run: npm run check:assurance
      - run: npm run test:desktop
      - run: npm audit --prefix desktop --audit-level=high

  desktop-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      DEBUG: pw:browser
      NOVA_DESKTOP_QA_DIR: ${{ github.workspace }}/.nova-data/desktop-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix desktop
      - run: npm run build
      - run: npm run desktop:build
      - name: Install the packaged Chromium sandbox helper in the disposable runner
        if: runner.os == 'Linux'
        run: |
          test -f desktop/release/linux-unpacked/chrome-sandbox
          sudo chown root:root desktop/release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 desktop/release/linux-unpacked/chrome-sandbox
      - name: Packaged Desktop contract acceptance
        if: runner.os != 'Linux'
        run: npm run check:desktop-ui
      - name: Packaged Desktop contract acceptance on virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run check:desktop-ui
      - name: Packaged Desktop to actual isolated Core
        if: runner.os != 'Linux'
        run: npm run check:desktop-core
      - name: Packaged Desktop to actual isolated Core on virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run check:desktop-core
      - name: Preserve UI reports and synthetic screenshots, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-component-qa-${{ matrix.os }}
          path: |
            .nova-data/desktop-qa/**/report.json
            .nova-data/desktop-qa/**/*.jpg
          retention-days: 14
          include-hidden-files: true
      - name: Packaged Desktop to full daemon and restart
        if: runner.os != 'Linux'
        run: npm run check:desktop-daemon
      - name: Packaged Desktop to full daemon and restart on virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run check:desktop-daemon
      - name: Preserve full daemon reports and synthetic screenshots, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-qa-${{ matrix.os }}
          path: |
            .nova-data/desktop-qa/**/report.json
            .nova-data/desktop-qa/**/*.jpg
          retention-days: 14
          include-hidden-files: true

  legacy-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --prefix dashboard --ignore-scripts
      - run: npm audit --prefix dashboard --audit-level=high
      - run: npm run --prefix dashboard build
