name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Native Windows installer prerequisite check
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -Check
      - name: Unix installer prerequisite check
        if: runner.os != 'Windows'
        run: sh install.sh --check
      - name: Seed isolated development configuration
        run: node scripts/setup.mjs --configure-only
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
        env:
          NOVA_SKIP_MODEL_RESOLVER_INIT: "1"
      - run: npm run build
      - name: Isolated compiled daemon boot and graceful stop
        run: npm run check:daemon
        timeout-minutes: 4
      - run: npm run check:catalogs
      - run: npm run check:assurance
      - run: npm run test:desktop
      - run: npm audit --prefix desktop --audit-level=high

  legacy-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --prefix dashboard --ignore-scripts
      - run: npm audit --prefix dashboard --audit-level=high
      - run: npm run --prefix dashboard build
