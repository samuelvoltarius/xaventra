name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  docker-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare trusted disposable dependency image
        shell: bash
        run: |
          node scripts/build-repair-sandbox.mjs | tee /tmp/docker-repair-image.log
          grep '^XAVENTRA_REPAIR_SANDBOX_IMAGE=' /tmp/docker-repair-image.log >> "$GITHUB_ENV"
      - name: Full Doctor to Docker recovery (scripted model, real tools and containers)
        run: node scripts/check-docker-repair.mjs
        timeout-minutes: 8
      - name: Real isolated state snapshot, original preservation and negative controls
        run: node scripts/check-docker-repair-state.mjs
        timeout-minutes: 5
      - name: Automatic image/source publication and actual background writer barrier
        run: node scripts/check-repair-publication.mjs
        timeout-minutes: 6
      - name: Shared-state peer migration, frozen baseline and actual rollback
        run: node scripts/check-repair-peers.mjs
        timeout-minutes: 5
      - name: Authenticated Docker host access and signed disposable lifecycle
        run: node scripts/check-host-agent.mjs
        timeout-minutes: 3
        env:
          XAVENTRA_HOST_TEST_IMAGE: ${{ env.XAVENTRA_REPAIR_SANDBOX_IMAGE }}
          XAVENTRA_HOST_QA_DIR: ${{ github.workspace }}/.nova-data/host-agent-qa
      - name: Signed upstream command to actual container update, state backup and rollback
        run: node scripts/check-container-update.mjs
        timeout-minutes: 4
      - name: Preserve end-to-end evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-repair-qa-linux
          path: |
            .nova-data/docker-repair-qa/**/report.json
            .nova-data/docker-repair-state-qa/**/report.json
            .nova-data/repair-publication-qa/**/report.json
            .nova-data/repair-peer-qa/**/report.json
            .nova-data/host-agent-qa/**/report.json
            .nova-data/container-update-qa/**/report.json
          retention-days: 14
          include-hidden-files: true
  managed-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Managed Linux activation with separate runtime UID and signed immutable releases
        shell: bash
        run: sudo "$(command -v node)" scripts/check-managed-repair.mjs
        timeout-minutes: 5
      - name: Preserve managed activation evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-repair-qa-linux
          path: .nova-data/managed-repair-qa/report.json
          retention-days: 14
          include-hidden-files: true
  repair-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Prepare trusted dependency-only image (no source or secrets)
        shell: bash
        run: |
          node scripts/build-repair-sandbox.mjs | tee /tmp/sandbox-build.log
          grep '^XAVENTRA_REPAIR_SANDBOX_IMAGE=' /tmp/sandbox-build.log >> "$GITHUB_ENV"
      - name: Real isolated repair, regression, rollback and restoration
        run: node scripts/check-repair-sandbox.mjs
        timeout-minutes: 22
      - name: Preserve real sandbox evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-sandbox-qa-linux
          path: .nova-data/sandbox-qa/report.json
          retention-days: 14
          include-hidden-files: true
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Native Windows installer prerequisite check
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -Check
      - name: Unix installer prerequisite check
        if: runner.os != 'Windows'
        run: sh install.sh --check
      - name: Seed isolated development configuration
        run: node scripts/setup.mjs --configure-only
      - run: npm run typecheck
      - name: Static layer reachability (not behavioral acceptance)
        run: npm run check:layer-graph
      - run: npm test -- --maxWorkers=2
        env:
          NOVA_SKIP_MODEL_RESOLVER_INIT: "1"
      - run: npm run build
      - name: Compiled layer behavior contracts (isolated fixtures)
        run: node scripts/check-layer-contracts.mjs
        timeout-minutes: 2
        env:
          XAVENTRA_LAYER_QA_DIR: ${{ github.workspace }}/.nova-data/layer-qa
      - name: Signed repair controller and independent live predicate (disposable processes)
        run: node scripts/check-repair-activation.mjs
      - name: Signed repair admission with two actual node processes
        run: node scripts/check-repair-drain.mjs
      - name: Preserve tool-admission evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-drain-qa-${{ matrix.os }}
          path: .nova-data/repair-drain-qa/**/report.json
          retention-days: 14
          include-hidden-files: true
      - name: Preserve repair controller evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-controller-qa-${{ matrix.os }}
          path: .nova-data/repair-qa/report.json
          retention-days: 14
          include-hidden-files: true
      - name: Preserve layer contract evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer-contract-qa-${{ matrix.os }}
          path: .nova-data/layer-qa/**/report.json
          retention-days: 14
          include-hidden-files: true
      - name: Compiled capability inventory, setup and restart acceptance
        run: node scripts/check-capability-inventory.mjs
        timeout-minutes: 3
        env:
          XAVENTRA_CAPABILITY_QA_DIR: ${{ github.workspace }}/.nova-data/capability-qa
      - name: Compiled upstream signature, HTTP download and restart acceptance
        run: node scripts/check-upstream-update.mjs
        timeout-minutes: 3
        env:
          XAVENTRA_UPSTREAM_QA_DIR: ${{ github.workspace }}/.nova-data/upstream-qa
      - name: Preserve upstream acceptance reports including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-update-qa-${{ matrix.os }}
          path: .nova-data/upstream-qa/**/report.json
          retention-days: 14
          include-hidden-files: true
      - name: Preserve capability acceptance reports including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-inventory-qa-${{ matrix.os }}
          path: .nova-data/capability-qa/**/report.json
          retention-days: 14
          include-hidden-files: true
      - name: Compiled Doctor artifact download and ESM configuration acceptance
        run: node scripts/check-doctor-artifacts.mjs
        timeout-minutes: 3
        env:
          XAVENTRA_DOCTOR_QA_DIR: ${{ github.workspace }}/.nova-data/doctor-qa
      - name: Preserve Doctor acceptance reports including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-artifact-qa-${{ matrix.os }}
          path: .nova-data/doctor-qa/**/report.json
          retention-days: 14
          include-hidden-files: true
      - name: Compiled Doctor result validation with scripted engine
        run: node --experimental-vm-modules scripts/check-doctor-validation.mjs
        timeout-minutes: 3
        env:
          XAVENTRA_DOCTOR_QA_DIR: ${{ github.workspace }}/.nova-data/doctor-qa
      - name: Preserve Doctor validation reports including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-validation-qa-${{ matrix.os }}
          path: .nova-data/doctor-qa/**/report.json
          retention-days: 14
          include-hidden-files: true
      - name: Compiled response contract and authenticated REST acceptance
        run: node scripts/check-response-contract.mjs
        timeout-minutes: 6
        env:
          XAVENTRA_RESPONSE_QA_DIR: ${{ github.workspace }}/.nova-data/response-qa
      - name: Actual Desktop API output contract acceptance
        run: node scripts/check-response-pipeline.mjs
        timeout-minutes: 3
        env:
          XAVENTRA_RESPONSE_QA_DIR: ${{ github.workspace }}/.nova-data/response-qa
      - name: Preserve response contract reports including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: response-contract-qa-${{ matrix.os }}
          path: .nova-data/response-qa/**/report.json
          retention-days: 14
          include-hidden-files: true
      - name: Isolated compiled daemon boot and graceful stop
        run: npm run check:daemon
        timeout-minutes: 4
      - name: Compiled daemon restart with reused own PID marker
        run: node scripts/check-daemon-lifecycle.mjs --seed-own-pid
        timeout-minutes: 4
      - name: Compiled daemon stops with an idle non-reading Mesh connection
        run: node scripts/check-daemon-lifecycle.mjs --mesh-idle-peer
        timeout-minutes: 4
      - run: npm run check:catalogs
      - run: npm run check:assurance
      - run: npm run test:desktop
      - run: npm audit --prefix desktop --audit-level=high

  desktop-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      DEBUG: pw:browser
      NOVA_DESKTOP_QA_DIR: ${{ github.workspace }}/.nova-data/desktop-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix desktop
      - run: npm run build
      - run: npm run desktop:build
      - name: Install the packaged Chromium sandbox helper in the disposable runner
        if: runner.os == 'Linux'
        run: |
          test -f desktop/release/linux-unpacked/chrome-sandbox
          sudo chown root:root desktop/release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 desktop/release/linux-unpacked/chrome-sandbox
      - name: Packaged Desktop contract acceptance
        if: runner.os != 'Linux'
        run: npm run check:desktop-ui
      - name: Packaged Desktop contract acceptance on virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run check:desktop-ui
      - name: Packaged Desktop to actual isolated Core
        if: runner.os != 'Linux'
        run: npm run check:desktop-core
      - name: Packaged Desktop to actual isolated Core on virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run check:desktop-core
      - name: Preserve UI reports and synthetic screenshots, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-component-qa-${{ matrix.os }}
          path: |
            .nova-data/desktop-qa/**/report.json
            .nova-data/desktop-qa/**/*.jpg
          retention-days: 14
          include-hidden-files: true
      - name: Packaged Desktop to full daemon and restart
        if: runner.os != 'Linux'
        run: npm run check:desktop-daemon
      - name: Packaged Desktop to full daemon and restart on virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run check:desktop-daemon
      - name: Preserve full daemon reports and synthetic screenshots, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-qa-${{ matrix.os }}
          path: |
            .nova-data/desktop-qa/**/report.json
            .nova-data/desktop-qa/**/*.jpg
          retention-days: 14
          include-hidden-files: true

  legacy-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --prefix dashboard --ignore-scripts
      - run: npm audit --prefix dashboard --audit-level=high
      - run: npm run --prefix dashboard build
