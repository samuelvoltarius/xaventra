name: Signed container updates
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Native signing is a SEPARATE, human-started run: an operator reviews the
  # native plan from a completed build run, then supplies its exact SHA256.
  workflow_dispatch:
    inputs:
      native_build_run_id:
        description: Completed run of this workflow whose native-plan artifact was reviewed
        required: true
      native_plan_sha256:
        description: Independently reviewed SHA256 of that run's native-plan.json
        required: true
permissions:
  contents: read
defaults:
  run:
    # GitHub's explicit `bash` adds -o pipefail, so `node ... | tee` fails with node.
    shell: bash
concurrency:
  # A dispatched native signing run may wait for environment approval; it must
  # never block or displace automatic container releases (one pending run per group).
  group: ${{ github.event_name == 'workflow_dispatch' && 'native-publish' || 'signed-container-update' }}
  cancel-in-progress: false
jobs:
  eligible:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && vars.XAVENTRA_UPDATE_PUBLISHING == 'enabled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.gate.outputs.commit }}
      version: ${{ steps.gate.outputs.version }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/github-script@v7
        id: gate
        with:
          script: |
            const run = (await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.payload.workflow_run.id })).data;
            const main = (await github.rest.repos.getBranch({ ...context.repo, branch: 'main' })).data;
            if (run.path !== '.github/workflows/ci.yml' || run.event !== 'push' || run.head_branch !== 'main' || run.conclusion !== 'success' || run.head_sha !== main.commit.sha || run.head_repository.full_name !== context.payload.repository.full_name) throw Error('Exact current-main CI required');
            const read = async path => JSON.parse(Buffer.from((await github.rest.repos.getContent({ ...context.repo, path, ref: run.head_sha })).data.content, 'base64'));
            const corePkg = await read('package.json'), desktop = await read('desktop/package.json');
            if (!/^\d+\.\d+\.\d+(?:-rc\.\d+)?$/.test(corePkg.version) || corePkg.version !== desktop.version) throw Error('Synchronized version required');
            try { await github.rest.repos.getReleaseByTag({ ...context.repo, tag: `v${corePkg.version}` }); core.setOutput('publish', 'false'); return; } catch (e) { if (e.status !== 404) throw e; }
            // Do not attach packages to a tag that someone moved or created separately.
            try { await github.rest.git.getRef({ ...context.repo, ref: `tags/v${corePkg.version}` }); throw Error('Tag exists without this publisher release'); } catch (e) { if (e.status !== 404) throw e; }
            core.setOutput('commit', run.head_sha); core.setOutput('version', corePkg.version); core.setOutput('publish', 'true');
  build:
    needs: eligible
    if: needs.eligible.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.eligible.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/release-source-provenance.mjs --check
      - run: npm ci --ignore-scripts && npm run build
      - run: node scripts/release-source-provenance.mjs --check
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: deploy/update/Dockerfile
          push: true
          tags: ghcr.io/samuelvoltarius/xaventra:build-${{ needs.eligible.outputs.commit }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/samuelvoltarius/xaventra
            org.opencontainers.image.revision=${{ needs.eligible.outputs.commit }}
            org.opencontainers.image.version=${{ needs.eligible.outputs.version }}
      - name: Test actual packaged daemon lifecycle before signing/public release
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker pull "ghcr.io/samuelvoltarius/xaventra@$IMAGE_DIGEST"
          IMAGE_ID=$(docker image inspect "ghcr.io/samuelvoltarius/xaventra@$IMAGE_DIGEST" --format '{{.Id}}')
          node scripts/check-update-image.mjs "$IMAGE_ID"
      - name: Record immutable image identity after clean-source acceptance
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: node -e "const fs=require('fs');if(!/^sha256:[a-f0-9]{64}$/.test(process.env.IMAGE_DIGEST))throw Error('Digest');fs.writeFileSync('image-'+process.env.TARGET_ARCH+'.txt','ghcr.io/samuelvoltarius/xaventra@'+process.env.IMAGE_DIGEST)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-package-acceptance-${{ matrix.arch }}
          path: .nova-data/update-image-qa/**/report.json
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: update-image-${{ matrix.arch }}
          path: image-*.txt
  # ---- Native Linux packages (CL-20260929-01). No publisher credential here. ----
  native-build:
    needs: eligible
    if: needs.eligible.outputs.publish == 'true' && vars.XAVENTRA_NATIVE_PUBLISHING == 'enabled'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.eligible.outputs.version }}
      RELEASE_COMMIT: ${{ needs.eligible.outputs.commit }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      # Reviewed tooling and the fresh build source are separate checkouts of the
      # same commit; the builder refuses a source tree with dist/ or node_modules/.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.eligible.outputs.commit }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.eligible.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle reviewed native builder
        working-directory: tooling
        run: |
          node scripts/release-source-provenance.mjs --check
          npm ci --ignore-scripts
          npx esbuild scripts/stage-native-build.mjs --bundle --platform=node --format=esm --target=node22 \
            "--banner:js=import{createRequire as __cr}from'module';const require=__cr(import.meta.url);" \
            --outfile="$RUNNER_TEMP/native-stage.mjs"
      - name: Build, inventory and qualify the native archive
        run: |
          node "$RUNNER_TEMP/native-stage.mjs" "$GITHUB_WORKSPACE/source" "$RELEASE_COMMIT" "$RELEASE_VERSION" "$TARGET_ARCH" | tee "$RUNNER_TEMP/stage.out"
          REPORT=$(tail -n 1 "$RUNNER_TEMP/stage.out" | node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8'));if(!r.passed)throw Error('Native stage failed');process.stdout.write(r.report)")
          ROOT=$(dirname "$REPORT")
          mkdir -p "native-out/$TARGET_ARCH"
          cp "$ROOT/payload.tar.gz" "$ROOT/plan-entry.json" "$ROOT/report.json" "$ROOT/inventory.json" "native-out/$TARGET_ARCH/"
      # Upload the qualified bytes BEFORE running payload code below; artifacts are
      # immutable, so a process started by the lifecycle test cannot alter them.
      - uses: actions/upload-artifact@v4
        with:
          name: native-build-${{ matrix.arch }}
          path: native-out/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
      - name: Start/stop the actual extracted daemon unprivileged before any signing
        working-directory: tooling
        run: |
          EXTRACT="$RUNNER_TEMP/native-payload-$TARGET_ARCH"
          mkdir "$EXTRACT"
          tar -xzf "$GITHUB_WORKSPACE/native-out/$TARGET_ARCH/payload.tar.gz" -C "$EXTRACT" --no-same-owner
          node scripts/check-daemon-lifecycle.mjs --source-root "$EXTRACT"
  native-plan:
    needs: [eligible, native-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.eligible.outputs.version }}
      RELEASE_COMMIT: ${{ needs.eligible.outputs.commit }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: native-build-*
          path: native-build
      - name: Bind the plan to exactly these two archives and this revision
        run: |
          node - <<'EOF'
          const fs = require('fs'), crypto = require('crypto')
          const version = process.env.RELEASE_VERSION, commit = process.env.RELEASE_COMMIT
          const builds = ['x64', 'arm64'].map(arch => {
            const dir = `native-build/native-build-${arch}`, entry = JSON.parse(fs.readFileSync(`${dir}/plan-entry.json`, 'utf8'))
            const report = JSON.parse(fs.readFileSync(`${dir}/report.json`, 'utf8')), archive = `${dir}/payload.tar.gz`
            if (Object.keys(entry).sort().join(',') !== 'arch,archive,sha256,size,treeHash' || entry.arch !== arch || entry.archive !== 'payload.tar.gz') throw Error('Plan entry identity')
            if (!report.passed || report.commit !== commit || report.version !== version || report.arch !== arch) throw Error('Build report identity')
            const bytes = fs.readFileSync(archive)
            if (bytes.length !== entry.size || crypto.createHash('sha256').update(bytes).digest('hex') !== entry.sha256) throw Error('Archive bytes differ from plan entry')
            return { ...entry, archive: `native-plan/${arch}.tar.gz` }
          })
          fs.mkdirSync('native-plan')
          for (const b of builds) fs.copyFileSync(`native-build/native-build-${b.arch}/payload.tar.gz`, b.archive)
          const text = JSON.stringify({ schema: 1, version, commit, builds })
          fs.writeFileSync('native-plan/native-plan.json', text)
          const sha = crypto.createHash('sha256').update(text).digest('hex')
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Native plan for ${version} at ${commit}: \`${sha}\`\n`
            + `Do NOT copy this value as approval. Download the native-plan artifact, review native-plan.json and both reports, `
            + `compute SHA256 of native-plan.json locally, then dispatch with native_build_run_id=${process.env.GITHUB_RUN_ID} and YOUR hash.\n`)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: native-plan
          path: native-plan
          if-no-files-found: error
          retention-days: 14
  native-gate:
    if: github.event_name == 'workflow_dispatch' && vars.XAVENTRA_NATIVE_PUBLISHING == 'enabled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.gate.outputs.commit }}
      version: ${{ steps.gate.outputs.version }}
      release: ${{ steps.gate.outputs.release }}
    steps:
      - name: Resolve the reviewed build run, its exact tag commit and the existing release
        id: gate
        uses: actions/github-script@v7
        env:
          BUILD_RUN: ${{ inputs.native_build_run_id }}
          PLAN_SHA: ${{ inputs.native_plan_sha256 }}
        with:
          script: |
            const runId = process.env.BUILD_RUN, planSha = process.env.PLAN_SHA;
            if (!/^[0-9]{1,20}$/.test(runId || '') || !/^[a-f0-9]{64}$/.test(planSha || '')) throw Error('Exact build run id and plan SHA256 required');
            // Only the protected main workflow definition may sign (branch-edited copies cannot).
            if (context.ref !== 'refs/heads/main') throw Error('Native signing must be dispatched from main');
            const run = (await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(runId) })).data;
            if (run.path !== '.github/workflows/update-release.yml' || run.event !== 'workflow_run' || run.conclusion !== 'success'
              || run.head_branch !== 'main' || run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) throw Error('Build run is not a successful native build of main');
            // Bound to the build run's commit and its release tag, not to whatever main is
            // now: later main commits must not make this version unpublishable.
            const cmp = (await github.rest.repos.compareCommits({ ...context.repo, base: run.head_sha, head: 'main' })).data;
            if (!['ahead', 'identical'].includes(cmp.status)) throw Error('Build commit is not in main history');
            const pkg = JSON.parse(Buffer.from((await github.rest.repos.getContent({ ...context.repo, path: 'package.json', ref: run.head_sha })).data.content, 'base64'));
            if (!/^\d+\.\d+\.\d+(?:-rc\.\d+)?$/.test(pkg.version)) throw Error('Exact version required');
            let ref = (await github.rest.git.getRef({ ...context.repo, ref: `tags/v${pkg.version}` })).data.object;
            if (ref.type === 'tag') ref = (await github.rest.git.getTag({ ...context.repo, tag_sha: ref.sha })).data.object;
            if (ref.type !== 'commit' || ref.sha !== run.head_sha) throw Error('Release tag does not point at the build commit');
            const release = (await github.rest.repos.getReleaseByTag({ ...context.repo, tag: `v${pkg.version}` })).data;
            if (release.draft) throw Error('Release must be the published container release');
            core.setOutput('commit', run.head_sha); core.setOutput('version', pkg.version); core.setOutput('release', String(release.id));
  native-publish:
    needs: native-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: update-publisher
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.native-gate.outputs.commit }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: native-plan
          path: native-plan
          run-id: ${{ inputs.native_build_run_id }}
          github-token: ${{ github.token }}
      # No npm, no bundler, no downloaded code in this credential job: the reviewed
      # checkout runs directly under Node type stripping; the hook refuses packages.
      - name: Sign native packages from the reviewed source
        env:
          RELEASE_VERSION: ${{ needs.native-gate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.native-gate.outputs.commit }}
          PLAN_SHA: ${{ inputs.native_plan_sha256 }}
          XAVENTRA_UPDATE_PUBLISHER_KEY: ${{ secrets.XAVENTRA_UPDATE_PUBLISHER_KEY }}
          XAVENTRA_UPDATE_PUBLISHER_ID: ${{ vars.XAVENTRA_UPDATE_PUBLISHER_ID }}
        run: |
          node --experimental-transform-types --import ./tooling/scripts/ts-source-hooks.mjs tooling/scripts/publish-native-update.mjs \
            "$RELEASE_VERSION" "$RELEASE_COMMIT" native-plan/native-plan.json "$PLAN_SHA" native-packages | tee native-publisher.out
      - name: Upload files first and the manifest last (resumable), then verify the whole native inventory
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.native-gate.outputs.release }}
          RELEASE_VERSION: ${{ needs.native-gate.outputs.version }}
        with:
          script: |
            const fs = require('fs'), crypto = require('crypto');
            const version = process.env.RELEASE_VERSION, releaseId = Number(process.env.RELEASE_ID);
            // The signer prints the contract inventory with the manifest last.
            const { assets } = JSON.parse(fs.readFileSync('native-publisher.out', 'utf8').trim().split('\n').at(-1));
            const local = fs.readdirSync('native-packages').sort();
            if (!Array.isArray(assets) || assets.length !== 6 || assets.at(-1) !== 'xaventra-native-update.json'
              || [...assets].sort().join('\n') !== local.join('\n')) throw Error('Signer inventory differs from output directory');
            const isNative = n => n === 'SHA256SUMS.native' || n.startsWith('xaventra-native');
            const list = async () => github.paginate(github.rest.repos.listReleaseAssets, { ...context.repo, release_id: releaseId, per_page: 100 });
            const sha = name => crypto.createHash('sha256').update(fs.readFileSync(`native-packages/${name}`)).digest('hex');
            const existing = (await list()).filter(a => isNative(a.name));
            if (existing.some(a => a.name === 'xaventra-native-update.json')) throw Error('Native manifest already published; never overwrite');
            // Resume after an interrupted upload: only byte-identical earlier files are kept.
            for (const a of existing) {
              if (!assets.includes(a.name) || a.state !== 'uploaded' || a.size !== fs.statSync(`native-packages/${a.name}`).size
                || a.digest !== `sha256:${sha(a.name)}`) throw Error(`Foreign or differing native asset ${a.name}; resolve manually, never overwrite`);
            }
            for (const name of assets) {
              if (existing.some(a => a.name === name)) continue;
              const data = fs.readFileSync(`native-packages/${name}`);
              const asset = (await github.rest.repos.uploadReleaseAsset({ ...context.repo, release_id: releaseId, name, data })).data;
              if (asset.name !== name || asset.state !== 'uploaded' || asset.size !== data.length) throw Error(`Asset verification failed at ${name}`);
            }
            // Exact native inventory: every contract file once, nothing else in the namespace.
            const final = (await list()).filter(a => isNative(a.name));
            const names = final.map(a => a.name).sort();
            if (names.join('\n') !== [...assets].sort().join('\n')) throw Error('Native release inventory differs from the contract');
            for (const a of final) if (a.state !== 'uploaded' || a.size !== fs.statSync(`native-packages/${a.name}`).size) throw Error(`Native asset ${a.name} incomplete`);
            await core.summary.addRaw(`Native ${version} published: ${names.join(', ')}`).write();
  publish:
    needs: [eligible, build]
    runs-on: ubuntu-latest
    environment: update-publisher
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.eligible.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: update-image-*
          merge-multiple: true
          path: image-digests
      - name: Sign update packages (no npm / application execution with signer)
        env:
          RELEASE_VERSION: ${{ needs.eligible.outputs.version }}
          RELEASE_COMMIT: ${{ needs.eligible.outputs.commit }}
          XAVENTRA_UPDATE_PUBLISHER_KEY: ${{ secrets.XAVENTRA_UPDATE_PUBLISHER_KEY }}
          XAVENTRA_UPDATE_PUBLISHER_ID: ${{ vars.XAVENTRA_UPDATE_PUBLISHER_ID }}
        run: node scripts/publish-update.mjs "$RELEASE_VERSION" "$RELEASE_COMMIT" update-packages "$(<image-digests/image-x64.txt)" "$(<image-digests/image-arm64.txt)"
      - name: Verify anonymous registry access before publishing a downloadable release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tokenResponse = await fetch('https://ghcr.io/token?service=ghcr.io&scope=repository%3Asamuelvoltarius%2Fxaventra%3Apull', { redirect: 'error', signal: AbortSignal.timeout(10000) });
            if (!tokenResponse.ok) throw Error('GHCR package must allow anonymous reads; no release published');
            const { token } = await tokenResponse.json();
            if (typeof token !== 'string' || token.length > 16384) throw Error('Invalid anonymous registry token');
            for (const arch of ['x64', 'arm64']) {
              const digest = fs.readFileSync(`image-digests/image-${arch}.txt`, 'utf8').trim().split('@')[1];
              if (!/^sha256:[a-f0-9]{64}$/.test(digest || '')) throw Error('Invalid digest');
              const r = await fetch(`https://ghcr.io/v2/samuelvoltarius/xaventra/manifests/${digest}`, { redirect: 'error', signal: AbortSignal.timeout(10000), headers: { authorization: `Bearer ${token}`, accept: 'application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' } });
              if (!r.ok || r.headers.get('docker-content-digest') !== digest) throw Error('Public immutable image unavailable; no release published');
              await r.body?.cancel();
            }
      - name: Create draft, upload complete inventory, then publish (never overwrite assets)
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.eligible.outputs.version }}
          RELEASE_COMMIT: ${{ needs.eligible.outputs.commit }}
        with:
          script: |
            const fs = require('fs');
            const version = process.env.RELEASE_VERSION, sha = process.env.RELEASE_COMMIT;
            const main = (await github.rest.repos.getBranch({ ...context.repo, branch: 'main' })).data;
            if (main.commit.sha !== sha) throw Error('Main advanced; no stale automatic publication');
            const release = (await github.rest.repos.createRelease({ ...context.repo, tag_name: `v${version}`, target_commitish: sha,
              name: `Xaventra ${version} — signed container update preview`, draft: true, prerelease: true,
              body: `Signed Linux container update from ${sha}. Not a full RC certification. See docs/RELEASE_PLAN.md and docs/CONTAINER_UPDATES.md. Native desktop signing and other open gates remain separate.` })).data;
            for (const name of fs.readdirSync('update-packages').sort()) {
              const data = fs.readFileSync(`update-packages/${name}`);
              const asset = (await github.rest.repos.uploadReleaseAsset({ ...context.repo, release_id: release.id, name, data })).data;
              if (asset.state !== 'uploaded' || asset.size !== data.length) throw Error('Asset verification failed; draft retained');
            }
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, draft: false });
